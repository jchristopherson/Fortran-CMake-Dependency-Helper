      <stop offset="0%" stop-color="#B78CFF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#1a1a1a"/>

  <!-- Centered triangle -->
